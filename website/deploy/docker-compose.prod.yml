# Production stack: Nginx (TLS) → app → MongoDB. See docs/deployment.md.
# Run from the website/ folder:  docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../server/.env.production
    environment:
      MONGODB_URI: mongodb://mongo:27017/arizen
      TRUST_PROXY: "1"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo
    expose:
      - "4000"

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Not published to the host: only the app can reach the database.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app

volumes:
  mongo-data:
  uploads:
