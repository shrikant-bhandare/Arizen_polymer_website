# Nginx in front of the Node app. Replace example.com with the real domain
# (both www and apex), then obtain certificates with certbot (docs/deployment.md).
# For a non-Docker (PM2) setup, change "app:4000" to "127.0.0.1:4000".

upstream arizen_app {
  server app:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name example.com www.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://www.example.com$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name example.com;
  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  return 301 https://www.example.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Uploads are limited by the app too (MAX_UPLOAD_MB); keep this slightly higher.
  client_max_body_size 12m;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  gzip_min_length 1024;

  location / {
    proxy_pass http://arizen_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
